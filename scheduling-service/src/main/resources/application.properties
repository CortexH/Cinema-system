spring.application.name=scheduling-service

# KAFKA PRODUCER
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# KAFKA CONSUMER
spring.kafka.consumer.group-id=scheduler-service-group
#spring.kafka.consumer.client-id=scheduler-service-consumer-${random.UUID}
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.allow-auto-create-topics=false

# KAFKA TOPICS
## PUBLISHER
kafka.topic.session.ended=session-ended-events


# H2
spring.datasource.url=jdbc:h2:mem:schedulerdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true


# OTHERS
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
application.url.room-service=${ROOM_SERVICE_URL:http://localhost:6969}
application.url.movie-service=${MOVIE_SERVICE_URL:http://localhost:6967}

server.port=6966
server.address=0.0.0.0